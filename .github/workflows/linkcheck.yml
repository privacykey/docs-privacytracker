name: Link check

on:
  pull_request:
    paths:
      - "**/*.mdx"
      - "**/*.md"
      - "docs.json"
      - "package.json"
      - "scripts/**"
      - "api-reference/openapi.yaml"
  push:
    branches: [main]
    paths:
      - "**/*.mdx"
      - "**/*.md"
      - "docs.json"
      - "package.json"
      - "scripts/**"
      - "api-reference/openapi.yaml"
  schedule:
    # Catch external-link rot weekly even when no docs change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    name: lychee
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, repo-ci]
    permissions:
      contents: read
      issues: write
    steps:
      # Before checkout: nothing is fetched onto the runner until the
      # context is proven trusted. A no-op on GitHub-hosted runners.
      - name: Assert trusted runner context
        uses: privacykey/gh-workflows/actions/assert-trusted-runner@v1

      - uses: actions/checkout@v4

      - name: Run docs smoke check
        run: npm run check

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 1d
            --no-progress
            --base .
            --exclude-path images
            --exclude-path .github
            --accept 200,206,429
            './**/*.mdx'
            './**/*.md'
          fail: true
          jobSummary: true

      - name: Open issue on schedule failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links found by scheduled link check"
          content-filepath: ./lychee/out.md
          labels: docs, broken-links
