        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated.

  /api/export:
    get:
      tags: [Import / export]
      summary: Export apps + labels as CSV or JSON
      parameters:
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum: [csv, json]
      responses:
        "200":
          description: Flat dump of every tracked app, label, snapshot, notification.
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/export/audit-bundle:
    post:
      tags: [Import / export]
      summary: Export an audit bundle
      description: |
        Curated subset suitable for sharing. Notes flagged `private` are excluded
        by SQL filter at build time. See [Security & trust → Audit-bundle export
        threat model](/security#audit-bundle-export-threat-model).
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Defaults to all tracked apps.
                includePrivacyProfile:
                  type: boolean
                  default: false
                attribution:
                  type: string
                  description: Free-text name attached to your annotations on the recipient's view.
      responses:
        "200":
          description: Bundle ready for download.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditBundle"

  /api/import/audit-bundle:
    post:
      tags: [Import / export]
      summary: Import a shared audit bundle
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditBundle"
      responses:
        "200":
          description: Bundle imported.
        "409":
          description: Bundle version is newer than this install supports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/imports:
    get:
      tags: [Import / export]
      summary: List import-history batches
      responses:
        "200":
          description: Batches.
    post:
      tags: [Import / export]
      summary: Create an import-history batch
      security:
        - sameOrigin: []
      responses:
        "200":
          description: Created.
    delete:
      tags: [Import / export]
      summary: Delete an import-history batch
      security:
        - sameOrigin: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted.

  /api/backup/snapshots:
    get:
      tags: [Backup]
      summary: List server-local rolling snapshots
      responses:
        "200":
          description: Snapshot files in `data/snapshots/`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      type: object
                      properties:
                        filename:
                          type: string
                        createdAt:
                          type: integer
                          format: int64
                        size:
                          type: integer
    put:
      tags: [Backup]
      summary: Update snapshot schedule + retention
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupSnapshotsConfig"
      responses:
        "200":
          description: Config updated.
    post:
      tags: [Backup]
      summary: Create a server-local snapshot now
      security:
        - sameOrigin: []
      responses:
        "200":
          description: Snapshot taken.

  /api/backup/snapshots/{filename}:
    get:
      tags: [Backup]
      summary: Download one server-local snapshot file
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JSON bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupBundle"
        "404":
          description: Snapshot not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/deployment/diagnostics:
    get:
      tags: [Deployment]
      summary: Safe deployment diagnostics
      description: |
        Self-host-friendly summary suitable for the Settings page or a support
        bundle. Never includes annotations, AI keys, or app names.
      responses:
        "200":
          description: Diagnostics payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentDiagnostics"

  /api/deployment/support-bundle:
    get:
      tags: [Deployment]
      summary: Copy/paste-safe support bundle
      description: |
        Same shape as `/api/deployment/diagnostics` but framed as a single
        copy/paste blob suitable for pasting into a GitHub issue.
      responses:
        "200":
          description: Plain-text bundle.
          content:
            text/plain:
              schema:
                type: string
