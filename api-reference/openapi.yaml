            format: int64
      responses:
        "200":
          description: Policy version row.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/policy/version/{id}/diff:
    get:
      tags: [Privacy policy]
      summary: Diff a policy version against its predecessor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Per-section diff.
          content:
