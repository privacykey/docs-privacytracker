openapi: 3.1.0
info:
  title: privacytracker API
  version: "0.1.2"
  description: |
    HTTP API for [privacytracker](https://github.com/privacykey/privacytracker) —
    the routes under `app/api/**`. Each route is a thin wrapper over helpers in
    `lib/`. Mutating routes are protected by a same-origin CSRF check and may
    require an `X-Auditor-Admin-Token` header when `AUDITOR_ADMIN_TOKEN` is
    configured.

    This spec covers the public-contract surface — the routes integrators most
    commonly hit. The full route map (including dev-only and internal routes) is
    on the [Overview page](/api-reference/introduction).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: GitHub Issues
    url: https://github.com/privacykey/privacytracker/issues

servers:
  - url: http://localhost:3000
    description: Local development / self-hosted

tags:
  - name: Apps
    description: Tracked iOS applications and their privacy labels.
  - name: Manual apps
    description: Apps tracked manually rather than via App Store scrape.
  - name: Search
    description: Resolve app names through the iTunes Search API.
  - name: Scrape
    description: Trigger App Store privacy-label scrapes.
  - name: Changelog
    description: Snapshot history and change events.
  - name: Compare
    description: Side-by-side comparison and related-app suggestions.
  - name: Stats
    description: Dashboard charts (privacy matrix, radar, timeline).
  - name: Annotations
    description: Per-app freeform notes with tags and visibility.
  - name: Verdicts
    description: Categorical per-app judgements (`safe`, `replace`, `uninstall`).
  - name: Notifications
    description: Bell-feed events and per-type notification preferences.
  - name: Activity
    description: Append-only activity log (sync events, migrations, exports).
  - name: Backup
    description: Export, preview, restore versioned data bundles.
  - name: Import / export
    description: Audit bundles, CSV/JSON dumps, import queues.
  - name: Privacy policy
    description: Developer privacy-policy fetching, hashing, and AI summarisation.
  - name: AI
    description: Provider config testing, model discovery, debug log.
  - name: Focus & flags
    description: Audience / goals state plus feature-flag overrides.
  - name: Profile & preferences
    description: Privacy profile, accessibility profile, locale, date format, coachmarks.
  - name: Tasks
    description: Bulk runner status (sync / wayback / policy).
  - name: Settings
    description: General application settings and desktop-only settings.
  - name: Deployment
    description: Diagnostics + support bundle for self-hosted instances.
  - name: Health
    description: Liveness and readiness probes.
  - name: Admin
    description: Destructive admin routes (reset, start-over). Always require both auth layers.

security:
  - {}
  - sameOrigin: []
  - adminToken: []

components:
  securitySchemes:
    sameOrigin:
      type: apiKey
      in: header
      name: Origin
      description: |
        Same-origin CSRF check. The `Origin` header must match the request host;
        enforced for every mutating verb (`POST`, `PUT`, `PATCH`, `DELETE`).
    adminToken:
      type: apiKey
      in: header
      name: X-Auditor-Admin-Token
      description: |
        Required when `AUDITOR_ADMIN_TOKEN` is set in the environment, and — on a
        network-exposed instance — on the sensitive read prefixes listed on the
        [Overview page](/api-reference/introduction#authentication). Verified with
        `crypto.timingSafeEqual`. Missing or wrong token returns 401. Failed
        attempts are recorded in `audit_log` with IP + user agent.

        Browser callers may send the `pt_admin_token` HttpOnly cookie instead;
        it is accepted everywhere this header is. Obtain it from
        `POST /api/auth/admin-token/login`.
    adminTokenCookie:
      type: apiKey
      in: cookie
      name: pt_admin_token
      description: |
        HttpOnly, `SameSite=strict`, 8-hour session cookie issued by
        `POST /api/auth/admin-token/login`. Equivalent to the
        `X-Auditor-Admin-Token` header on every gated route.

  schemas:
    Error:
      type: object
      required: [error]
      description: |
        Standard error envelope. `error` is a human-readable sentence, **not** a
        stable machine code — branch on the HTTP status, not on the string.
        A few routes add extra structured fields alongside it; those are
        documented on the operation that returns them.
      properties:
        error:
          type: string
          description: Human-readable message. Not stable across releases.
          example: Admin token required

    App:
      type: object
      required: [id, name, url, changeCount]
      properties:
        id:
          type: integer
          format: int64
          description: Apple track ID extracted from `/id<digits>/` in the App Store URL.
          example: 324684580
        name:
          type: string
          example: Spotify - Music and Podcasts
        bundleId:
          type: string
          nullable: true
          example: com.spotify.client
        developer:
          type: string
          nullable: true
          example: Spotify Ltd.
        url:
          type: string
          format: uri
          example: https://apps.apple.com/us/app/spotify-music-and-podcasts/id324684580
        privacyPolicyUrl:
          type: string
          format: uri
          nullable: true
        firstSeen:
          type: integer
          format: int64
          description: Unix timestamp (ms) of first scrape.
        changeCount:
          type: integer
          description: Unacknowledged change events. Drives the bell badge.
          example: 2

    AppsPage:
      type: object
      description: |
        Paginated envelope returned by `GET /api/apps` when `limit` is
        supplied. Added in the large-fleet pagination work; the bare-array
        form remains the default when `limit` is absent.
      required: [apps, total, limit, offset]
      properties:
        apps:
          type: array
          items:
            $ref: "#/components/schemas/App"
        total:
          type: integer
          description: Total tracked apps in the fleet (not just this page).
          example: 5000
        limit:
          type: integer
          example: 500
        offset:
          type: integer
          example: 0
        meta:
          type: object
          description: |
            Present only when `meta=grid` was requested. Per-app side-band
            maps keyed by app id, scoped to this page's apps — an absent key
            means "no data" (no badge / undecided / no pending changes / no
            device links).
          properties:
            profileBadges:
              type: object
              additionalProperties: true
              description: appId → privacy-profile match badge.
            pendingChangeCategoriesByApp:
              type: object
              additionalProperties: true
              description: "appId → { privacy, accessibility, policy } booleans."
            userVerdicts:
              type: object
              additionalProperties:
                type: string
                enum: [safe, replace, uninstall]
              description: appId → the user's own verdict.
            appDeviceMap:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: appId → linked device ids.

    PrivacyType:
      type: object
      required: [name, categories]
      properties:
        name:
          type: string
          example: Data Linked to You
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyCategory"

    PrivacyCategory:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Location
        purposes:
          type: array
          items:
            type: string
          example: [Analytics, App Functionality]

    SearchResult:
      type: object
      required: [trackId, trackName, sellerName, artworkUrl, url]
      properties:
        trackId:
          type: integer
          format: int64
        trackName:
          type: string
        sellerName:
          type: string
        bundleId:
          type: string
          nullable: true
        artworkUrl:
          type: string
          format: uri
        url:
          type: string
          format: uri

    ScrapeRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string
            format: uri
          example:
            - https://apps.apple.com/us/app/spotify-music-and-podcasts/id324684580
        resync:
          type: boolean
          default: false
          description: Re-scrape an app already in the database (produces change notifications).

    ScrapeResult:
      type: object
      required: [scraped, errors]
      properties:
        scraped:
          type: array
          items:
            $ref: "#/components/schemas/App"
        errors:
          type: array
          items:
            type: object
            required: [url, error]
            properties:
              url:
                type: string
                format: uri
              error:
                type: string

    ChangelogRow:
      type: object
      required: [appId, scrapedAt, changes, source]
      properties:
        appId:
          type: integer
          format: int64
        scrapedAt:
          type: integer
          format: int64
          description: Unix timestamp (ms).
        source:
          type: string
          enum: [live, wayback]
        triggered_by:
          type: string
          nullable: true
          enum: [scheduled, manual, import, wayback, null]
        wayback_snapshot_url:
          type: string
          format: uri
          nullable: true
        matches_live_sync:
          type: boolean
        changes:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind:
                type: string
                enum: [category_added, category_removed, severity_changed]
              category:
                type: string
              from:
                type: string
                nullable: true
              to:
                type: string
                nullable: true

    BackupBundle:
      type: object
      description: |
        Versioned export of every app, label, snapshot, annotation,
        notification, focus state, and feature-flag override. Restorable into
        any release that understands this bundle format or a later one.

        Exported envelopes also carry a `signature` object (HMAC-SHA256 over
        the canonicalised envelope, keyed per install). Restoring a bundle
        whose signature doesn't match the target install requires
        `allowUntrusted` — see `POST /api/backup/restore`.
      properties:
        version:
          type: integer
          description: Bundle format version — not the app version.
          example: 1
        exportedAt:
          type: integer
          format: int64
        apps:
          type: array
          items:
            $ref: "#/components/schemas/App"
        # Other top-level keys (snapshots, annotations, notifications, settings,
        # feature_flag_overrides) are stable shapes documented in lib/audit-bundle.ts
        # but elided here for brevity.

    TasksActive:
      type: object
      required: [wayback, sync, policy]
      properties:
        wayback:
          $ref: "#/components/schemas/BulkRunnerStatus"
        sync:
          $ref: "#/components/schemas/BulkRunnerStatus"
        policy:
          $ref: "#/components/schemas/BulkRunnerStatus"

    BulkRunnerStatus:
      type: object
      required: [running]
      properties:
        running:
          type: boolean
        initiator:
          type: string
          nullable: true
          enum: [manual, scheduled, resume, null]
        currentAppName:
          type: string
          nullable: true
        runId:
          type: string
          nullable: true
        summary:
          type: object
          nullable: true
          properties:
            total:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok

    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: true
          description: |
            Per-check detail from the deployment diagnostics — which probe
            failed and why. Shape is diagnostic output, not a stable contract.

    ManualApp:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Locally-generated identifier (UUID).
          example: 3d6f0c8c-9b6e-4a78-9c3d-1d5b9c8e3a02
        name:
          type: string
        url:
          type: string
          format: uri
          nullable: true
        privacyPolicyUrl:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
          nullable: true

    Annotation:
      type: object
      required: [id, appId, body, visibility, tag, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        appId:
          type: integer
          format: int64
        body:
          type: string
          description: Markdown.
        tag:
          type: string
          enum: [concern, positive, follow_up, other]
        visibility:
          type: string
          enum: [export, private]
          description: Notes flagged `private` are unconditionally excluded from audit-bundle exports.
        updatedAt:
          type: integer
          format: int64
        deletedAt:
          type: integer
          format: int64
          nullable: true
          description: Set during the 30-second soft-delete window; null if active.

    Verdict:
      type: object
      required: [appId, verdict, updatedAt]
      description: |
        A user's categorical judgement about one app. Stored in `app_verdicts`,
        with a `CHECK` constraint pinning `verdict` to the three values below.
      properties:
        appId:
          type: string
          description: Apple's numeric track ID, as a string.
          example: "324684580"
        verdict:
          type: string
          enum: [safe, replace, uninstall]
        rationale:
          type: string
          nullable: true
        source:
          type: string
          enum: [user, imported]
          description: |
            `imported` rows come from an audit bundle, not from this endpoint.
          readOnly: true
        sourceName:
          type: string
          nullable: true
          description: Recommender display name when `source` is `imported`; null otherwise.
          readOnly: true
        setAt:
          type: integer
          format: int64
          readOnly: true
        updatedAt:
          type: integer
          format: int64

    Notification:
      type: object
      required: [id, kind, appId, createdAt, read]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - app_changed
            - sync_resumed
            - wayback_resumed
            - policy_resumed
            - sync_stale_cleared
            - wayback_stale_cleared
            - policy_stale_cleared
        appId:
          type: integer
          format: int64
          nullable: true
          description: Null for cross-cutting events (resume notifications use synthetic ids like `__sync_resume__`).
        createdAt:
          type: integer
          format: int64
        read:
          type: boolean
        title:
          type: string
        body:
          type: string

    NotificationPrefs:
      type: object
      additionalProperties:
        type: boolean
      description: |
        Map of notification type → enabled. Keys mirror the `Notification.kind`
        enum. Migrated from a single `notification_prefs` JSON blob in
        `app_settings` by step 3 of the boot migration.

    Focus:
      type: object
      required: [audience]
      description: |
        Audience + goal booleans, flat — the goals are top-level fields, not a
        nested object. `monitor` and `cleanup` were formerly `understand` and
        `declutter`; the boot migration re-keys stored rows.
      properties:
        audience:
          type: string
          enum: [self, loved_one, guardian]
        monitor:
          type: boolean
          default: false
        cleanup:
          type: boolean
          default: false
        minimal:
          type: boolean
          default: false
          description: Mutually exclusive with `monitor` and `cleanup`.
        accessibility:
          type: boolean
          default: false
          description: Modifier — combines with any primary goal.
        workflow:
          type: string
          enum: [self_monitor, self_cleanup, other_handoff, other_monitor, custom]
          description: |
            Inferred from audience + goals when omitted on write, collapsing to
            `custom` where the answer is ambiguous. `other_handoff` is what
            unlocks audit-bundle export.
        childAgeBand:
          type: string
          nullable: true
          description: Guardian-only age band. Empty string or null clears it.
        aiConfigured:
          type: boolean
          readOnly: true
          description: Derived from `ai_provider`. Read-only.

    FeatureFlagsSnapshot:
      type: object
      additionalProperties:
        type: string
        enum: [on, off, collapsed]
      description: |
        Resolved values for every flag the current build knows about. Keys follow
        `flag.<surface>.<area>.<feature>`; values are the resolution after
        hard-default → audience → goals → accessibility → runtime → override.

    PrivacyProfile:
      type: object
      description: Tolerances the user has set for data collection, sharing, retention, etc. Shape lives in the source.
      additionalProperties: true

    AccessibilityProfile:
      type: object
      description: Per-user accessibility preferences (high contrast, reduced motion, etc.).
      additionalProperties: true

    Preferences:
      type: object
      description: General per-user preferences not covered by focus or profiles.
      additionalProperties: true

    StatsResponse:
      type: object
      description: |
        Shape varies per stats endpoint (`/api/stats/matrix`, `/api/stats/radar`,
        `/api/stats/timeline`). Each is a typed payload consumed by the matching
        chart component in `app/components/charts/`.
      additionalProperties: true

    ActivityRow:
      type: object
      required: [id, kind, at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          example: sync_completed
        at:
          type: integer
          format: int64
        appId:
          type: integer
          format: int64
          nullable: true
        details:
          type: object
          additionalProperties: true

    AuditBundle:
      type: object
      description: |
        Curated export for sharing apps + labels + AI summaries + exportable
        annotations. Private notes (`visibility = 'private'`) are excluded by
        SQL filter at build time. Recipient imports via
        `POST /api/import/audit-bundle`. See [Security & trust → Audit-bundle
        export threat model](/security#audit-bundle-export-threat-model).
      additionalProperties: true

    BackupSnapshotsConfig:
      type: object
      properties:
        cadence:
          type: string
          enum: [off, daily, weekly, monthly]
        retention:
          type: integer
          minimum: 1
          maximum: 30
          description: How many recent snapshots to keep.

    DeploymentDiagnostics:
      type: object
      description: |
        Safe-to-share deployment diagnostics — privacytracker version, Node
        version, OS, DB path, schema version, sync state, mutex states. Never
        includes annotations, AI keys, or app names.
      additionalProperties: true

paths:
  /api/auth/admin-token/login:
    post:
      tags: [Admin]
      summary: Exchange the admin token for a session cookie
      description: |
        Constant-time compares the supplied token against `AUDITOR_ADMIN_TOKEN`
        and, on a match, sets `pt_admin_token` — HttpOnly, `SameSite=strict`,
        `Secure` over HTTPS, 8-hour max-age. Every route that accepts the
        `X-Auditor-Admin-Token` header accepts this cookie instead.

        Exempt from the non-local admin gate (it is how a caller obtains the
        cookie), but same-origin is still required. Rate-limited to 5 attempts
        per minute per client, with an IP-independent backstop of 100 failed
        attempts per 15 minutes.
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
              example: pt_admin_token=…; HttpOnly; SameSite=Strict; Path=/; Max-Age=28800
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Body malformed or token missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token did not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Same-origin check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Per-client limit or the global brute-force backstop tripped.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`AUDITOR_ADMIN_TOKEN` is not configured on the server."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/admin-token/logout:
    post:
      tags: [Admin]
      summary: Clear the admin-token session cookie
      description: |
        Server-side counterpart to login — the cookie is HttpOnly, so JavaScript
        cannot delete it. Same-origin required.
      security:
        - sameOrigin: []
      responses:
        "200":
          description: Cookie cleared.
        "403":
          description: Same-origin check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/admin-token/status:
    get:
      tags: [Admin]
      summary: Is an admin token configured, and is this caller unlocked?
      description: Never returns the token itself.
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema:
                type: object
                required: [configured, unlocked]
                properties:
                  configured:
                    type: boolean
                    description: "`AUDITOR_ADMIN_TOKEN` is set on the server."
                  unlocked:
                    type: boolean
                    description: This request carried a valid cookie or header.

  /api/health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: "Returns 200 with `{ status: \"ok\" }` whenever the process is responding and a one-row SQLite ping succeeds; 503 with `{ status: \"degraded\" }` otherwise. Used for cheap uptime checks."
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: DB ping failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Returns 200 with `{ status: "ready" }` only when the database is
        reachable **and** the data directory is writable; otherwise 503 with
        `{ status: "not_ready" }` and the failing entries in `checks`. Used by
        container healthchecks and reverse-proxy readiness gates.
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Not ready (DB unreachable or data dir not writable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /api/apps:
    get:
      tags: [Apps]
      summary: List tracked apps
      description: |
        Without `limit`, returns the complete fleet as a bare JSON array —
        the legacy form, kept stable for existing consumers. Its response
        size grows linearly with the fleet (~0.7 KB per app), so for
        installs tracking more than ~1,000 apps prefer the paginated form:
        the presence of `limit` switches the response to an
        `{ apps, total, limit, offset }` envelope. Pages are ordered by app
        name (then id), so `offset` paging is deterministic across requests.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: |
            Page size (1–500). Supplying this parameter opts into the
            paginated envelope response; values outside the range return 400.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: |
            Row offset into the name-ordered fleet. Only meaningful together
            with `limit`. An offset past the end returns an empty page, not
            an error.
        - in: query
          name: meta
          schema:
            type: string
            enum: [grid]
          description: |
            With `meta=grid` (and `limit`), the envelope gains a `meta`
            object carrying the per-app side-band maps the apps grid
            renders — profile badges, user verdicts, pending-change
            breakdown, and device links — scoped to the returned page.
        - in: query
          name: view
          schema:
            type: string
            enum: [grouped]
          description: Returns the grouped privacy view used by dashboards.
      responses:
        "200":
          description: |
            Bare array of apps (no `limit`), or a pagination envelope
            (with `limit`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/App"
                  - $ref: "#/components/schemas/AppsPage"
        "400":
          description: Invalid `limit` or `offset`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Apps]
      summary: Delete an app
      description: |
        Removes the app and its snapshots. Destructive — requires same-origin
        and (if configured) the admin token.
      security:
        - sameOrigin: []
          adminToken: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Deleted.
        "401":
          description: "Admin token required but missing or invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Same-origin CSRF check failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/search:
    post:
      tags: [Search]
      summary: Resolve app names to App Store candidates
      description: Hits Apple's iTunes Search API and ranks the results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: spotify
                country:
                  type: string
                  default: us
                  example: us
      responses:
        "200":
          description: Ranked list of matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"

  /api/scrape:
    post:
      tags: [Scrape]
      summary: Scrape App Store privacy labels
      description: |
        Fetches each App Store URL, parses the privacy section, and persists
        the result. With `resync: true`, re-scrapes apps already in the DB and
        produces change notifications.
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeRequest"
      responses:
        "200":
          description: Scrape complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResult"
        "429":
          description: |
            Rate-limited. Two causes: privacytracker's own per-client limiter
            (30 requests/minute on this route), or Apple rate-limiting the
            upstream fetch. The internal limiter sets `Retry-After` and clears
            within its window; Apple's cooldown is longer.
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Set by the internal limiter.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

