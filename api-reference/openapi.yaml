      summary: Reset application data
      description: Wipes every tracked app and snapshot. Settings (focus, AI provider, feature flags) are preserved.
      security:
        - sameOrigin: []
          adminToken: []
      responses:
        "200":
          description: Reset complete.
        "401":
          description: "Admin token required but missing or invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Same-origin CSRF check failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "A sync is currently running."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "More than 30 reset attempts in 10 minutes."
          content:
            application/json:
              schema:
