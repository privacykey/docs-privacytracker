  /api/annotations:
    get:
      tags: [Annotations]
      summary: List annotations
      parameters:
        - in: query
          name: appId
          schema:
            type: integer
            format: int64
          description: Filter to one app.
        - in: query
          name: visibility
          schema:
            type: string
            enum: [export, private, all]
            default: all
      responses:
        "200":
          description: Annotation list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  annotations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Annotation"
    post:
      tags: [Annotations]
      summary: Create an annotation
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appId, body, tag, visibility]
              properties:
                appId:
                  type: integer
                  format: int64
                body:
                  type: string
                tag:
                  type: string
                  enum: [concern, positive, follow_up, other]
                visibility:
                  type: string
                  enum: [export, private]
      responses:
        "200":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"

  /api/annotations/{id}:
    patch:
      tags: [Annotations]
      summary: Update an annotation
      security:
        - sameOrigin: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                tag:
                  type: string
                  enum: [concern, positive, follow_up, other]
                visibility:
                  type: string
                  enum: [export, private]
      responses:
        "200":
          description: Updated.
    delete:
      tags: [Annotations]
      summary: Soft-delete an annotation
      description: Marks the annotation deleted. A 30-second undo window is enforced client-side; after that it stays soft-deleted.
      security:
        - sameOrigin: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Soft-deleted.
    put:
      tags: [Annotations]
      summary: Restore a soft-deleted annotation
      description: Used by the 30-second undo affordance.
      security:
        - sameOrigin: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Restored.

