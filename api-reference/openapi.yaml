      tags: [Manual apps]
      summary: Create a manually-tracked app
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualApp"
      responses:
        "200":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualApp"

  /api/manual-apps/{id}:
    get:
      tags: [Manual apps]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manual app detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualApp"
    put:
      tags: [Manual apps]
      summary: Update a manual app
      security:
        - sameOrigin: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualApp"
      responses:
        "200":
          description: Updated.
    delete:
      tags: [Manual apps]
      summary: Delete a manual app
      security:
        - sameOrigin: []
          adminToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted.

  /api/manual-apps/{id}/scrape:
    post:
      tags: [Manual apps]
      summary: Re-scrape a manual app's policy URL
      security:
        - sameOrigin: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scrape complete.

  /api/compare:
    get:
      tags: [Compare]
      summary: Compare data across tracked apps
      parameters:
        - in: query
          name: appIds
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
          description: Comma-separated app ids to compare.
      responses:
        "200":
          description: Side-by-side comparison payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      $ref: "#/components/schemas/App"
                  matrix:
                    type: object
                    additionalProperties: true
                    description: Severity-coded grid keyed by category.

  /api/related-apps:
    get:
      tags: [Compare]
      summary: Related-app suggestions
      parameters:
        - in: query
          name: appId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Suggestions based on label overlap and category proximity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  related:
                    type: array
                    items:
                      $ref: "#/components/schemas/App"

  /api/stats/matrix:
