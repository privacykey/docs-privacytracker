            format: int64
      responses:
        "200":
          description: Current state of the policy summarisation pipeline for this app.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [idle, fetching, summarising, error, done]
                  lastUpdatedAt:
