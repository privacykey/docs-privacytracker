        - sameOrigin: []
          adminToken: []
      responses:
        "200":
          description: Start-over complete.
        "401":
          description: "Admin token required but missing or invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Same-origin CSRF check failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/apps/{id}/history-stats:
    get:
      tags: [Apps]
      summary: Per-app history aggregates
      description: |
        Returns timeline aggregate widgets — `categoryTrend` (added/removed
        per quarter) and `quarterly` (change-event counts for the sparkline).
        Calendar quarters are aligned to Q1 2021 (1 February 2021), the earliest era Apple's HTML carries privacy nutrition labels.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Aggregates for the app's timeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  categoryTrend:
                    type: array
                    items:
                      type: object
                      properties:
                        quarter:
                          type: string
                          example: "2021-Q1"
                        added:
                          type: integer
                        removed:
                          type: integer
                  quarterly:
                    type: array
                    items:
                      type: object
                      properties:
                        quarter:
                          type: string
                        changes:
                          type: integer

