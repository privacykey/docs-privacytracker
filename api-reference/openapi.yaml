  /api/policy/version/{id}/diff:
    get:
      tags: [Privacy policy]
      summary: Diff a policy version against its predecessor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Per-section diff.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/ai/test:
    post:
      tags: [AI]
      summary: Test an AI provider configuration
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [openai, anthropic, custom]
                baseUrl:
                  type: string
                  format: uri
                apiKey:
                  type: string
                model:
                  type: string
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  detail:
                    type: string
                    nullable: true

  /api/ai/models:
    post:
      tags: [AI]
      summary: Fetch available models from a provider
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [openai, anthropic, custom]
                baseUrl:
                  type: string
                  format: uri
                apiKey:
                  type: string
      responses:
        "200":
          description: Available models.
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: string

  /api/ai/debug-log:
    get:
      tags: [AI]
      summary: Read AI debug log entries
      description: |
        This read requires the admin token whenever `AUDITOR_ADMIN_TOKEN` is
        set OR the instance is network-exposed. `/api/ai/debug-log` is one of
        the proxy's gated read prefixes, and this handler additionally checks
        `adminTokenConfigured() || isNetworkExposed()` — so a loopback-only
        install with a token configured still gets a 401.
      security:
        - {}
        - adminToken: []
        - adminTokenCookie: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Debug log rows newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
    delete:
      tags: [AI]
      summary: Clear the AI debug log
      security:
        - sameOrigin: []
          adminToken: []
      responses:
        "200":
          description: Cleared.

  /api/focus:
    get:
      tags: [Focus & flags]
      summary: Read focus state (audience + goals)
      responses:
        "200":
          description: Current focus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Focus"
    post:
      tags: [Focus & flags]
      summary: Write focus state
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Focus"
      responses:
        "200":
          description: Updated.

  /api/feature-flags:
    get:
      tags: [Focus & flags]
      summary: Resolved feature flags
      description: |
        Returns the resolved value of every flag the current build knows about.
        Resolution order is: hard default → audience → goals → accessibility →
        runtime checks (Tauri, dependencies) → user override.
      responses:
        "200":
          description: Resolved flag map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagsSnapshot"

  /api/feature-flags/overrides:
    post:
      tags: [Focus & flags]
      summary: Bulk set feature-flag overrides
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
                enum: [on, off, collapsed]
              example:
                "flag.detail.timeline.wayback_rows": "off"
                "flag.appgrid.filter.risk_buttons": "collapsed"
      responses:
        "200":
          description: Overrides written.
    delete:
      tags: [Focus & flags]
      summary: Clear every override
      security:
        - sameOrigin: []
      responses:
        "200":
          description: All overrides cleared.

  /api/feature-flags/overrides/{key}:
    delete:
      tags: [Focus & flags]
      summary: Clear one feature-flag override
      security:
        - sameOrigin: []
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          description: The flag key, URL-encoded (e.g. `flag.detail.timeline.wayback_rows`).
      responses:
        "200":
          description: Cleared.

  /api/privacy-profile:
    get:
      tags: [Profile & preferences]
      summary: Read privacy profile
      responses:
        "200":
          description: Privacy profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyProfile"
    put:
      tags: [Profile & preferences]
      summary: Write privacy profile
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyProfile"
      responses:
        "200":
          description: Updated.

  /api/accessibility-profile:
    get:
      tags: [Profile & preferences]
      responses:
        "200":
          description: Accessibility profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessibilityProfile"
    put:
      tags: [Profile & preferences]
      summary: Write accessibility profile
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessibilityProfile"
      responses:
        "200":
          description: Updated.

  /api/preferences:
    get:
      tags: [Profile & preferences]
      responses:
        "200":
          description: General preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
    put:
      tags: [Profile & preferences]
      summary: Write general preferences
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Updated.

  /api/locale:
    get:
      tags: [Profile & preferences]
      summary: Read locale preference
      responses:
        "200":
          description: Locale.
          content:
            application/json:
              schema:
                type: object
                properties:
                  locale:
                    type: string
                    example: en
    post:
      tags: [Profile & preferences]
      summary: Write locale preference
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
                  example: zh
      responses:
        "200":
          description: Updated.

  /api/settings:
    get:
      tags: [Settings]
      summary: Read application settings
      responses:
        "200":
          description: Setting key/value pairs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Settings]
      summary: Write application settings
      security:
        - sameOrigin: []
          adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated.

  /api/settings/desktop:
    get:
      tags: [Settings]
      summary: Read desktop-only settings
      responses:
        "200":
          description: Desktop settings (auto-update preferences, sidecar timeouts, etc.).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Settings]
      summary: Write desktop-only settings
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated.

  /api/export:
    get:
      tags: [Import / export]
      summary: Export apps + labels as CSV or JSON
      description: |
        On a network-exposed instance this read requires the admin token —
        `/api/export` is one of the gated read prefixes.
      security:
        - {}
        - adminToken: []
        - adminTokenCookie: []
      parameters:
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum: [csv, json]
      responses:
        "200":
          description: Flat dump of every tracked app, label, snapshot, notification.
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/export/audit-bundle:
    post:
      tags: [Import / export]
      summary: Export an audit bundle
      description: |
        Curated subset suitable for sharing. Notes flagged `private` are excluded
        by SQL filter at build time. See [Security & trust → Audit-bundle export
        threat model](/security#audit-bundle-export-threat-model).

        Gated: allowed when the `flag.settings.admin.export.audit_bundle` feature
        flag resolves to `on`, or when `flag.focus.workflow` is `other_handoff`.
        Otherwise 403. On a network-exposed instance the admin token is required
        too — `/api/export` is a gated read prefix, and this is a mutation.
      security:
        - sameOrigin: []
      requestBody:
        required: false
        description: |
          Optional. The bundle always covers every tracked app — there is no
          per-app selection on this route.
        content:
          application/json:
            schema:
              type: object
              properties:
                recommenderName:
                  type: string
                  nullable: true
                  description: |
                    Free-text name attached to your annotations on the
                    recipient's view. Falls back to "your friend".
                includeRecommenderProfile:
                  type: boolean
                  default: true
                  description: Include the privacy profile you assessed against.
                migrationFlow:
                  type: boolean
                  default: false
                  description: |
                    Mark the bundle as a same-user migration, so the receiving
                    install skips the provenance banner.
      responses:
        "200":
          description: Bundle ready for download.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditBundle"
        "403":
          description: |
            Export not enabled for this focus — neither the feature flag nor an
            `other_handoff` workflow allows it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: More than 5 exports in a minute.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/import/audit-bundle:
    post:
      tags: [Import / export]
      summary: Import a shared audit bundle
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditBundle"
      responses:
        "200":
          description: Bundle imported.
        "409":
          description: Bundle version is newer than this install supports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/imports:
    get:
      tags: [Import / export]
      summary: List import-history batches
      responses:
        "200":
          description: Batches.
    post:
      tags: [Import / export]
      summary: Create an import-history batch
      security:
        - sameOrigin: []
      responses:
        "200":
          description: Created.
    delete:
      tags: [Import / export]
      summary: Delete an import-history batch
      security:
        - sameOrigin: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted.

  /api/backup/snapshots:
    get:
      tags: [Backup]
      summary: List server-local rolling snapshots
      responses:
        "200":
          description: Snapshot files in `data/backups/` under the data directory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      type: object
                      properties:
                        filename:
                          type: string
                        createdAt:
                          type: integer
                          format: int64
                        size:
                          type: integer
    put:
      tags: [Backup]
      summary: Update snapshot schedule + retention
      security:
        - sameOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupSnapshotsConfig"
      responses:
        "200":
          description: Config updated.
    post:
      tags: [Backup]
      summary: Create a server-local snapshot now
      security:
        - sameOrigin: []
      responses:
        "200":
          description: Snapshot taken.

  /api/backup/snapshots/{filename}:
    get:
      tags: [Backup]
      summary: Download one server-local snapshot file
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JSON bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupBundle"
        "404":
          description: Snapshot not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/deployment/diagnostics:
    get:
      tags: [Deployment]
      summary: Safe deployment diagnostics
      description: |
        Self-host-friendly summary suitable for the Settings page or a support
        bundle. Never includes annotations, AI keys, or app names.

        On a network-exposed instance this read requires the admin token —
        `/api/deployment/` is one of the gated read prefixes.
      security:
        - {}
        - adminToken: []
        - adminTokenCookie: []
      responses:
        "200":
          description: Diagnostics payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentDiagnostics"

  /api/deployment/support-bundle:
    get:
      tags: [Deployment]
      summary: Copy/paste-safe support bundle
      description: |
        Same shape as `/api/deployment/diagnostics` but framed as a single
        copy/paste blob suitable for pasting into a GitHub issue.

        On a network-exposed instance this read requires the admin token —
        `/api/deployment/` is one of the gated read prefixes.
      security:
        - {}
        - adminToken: []
        - adminTokenCookie: []
      responses:
        "200":
          description: Plain-text bundle.
          content:
            text/plain:
              schema:
                type: string
